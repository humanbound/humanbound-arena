# hb arena runs this with its own hardening on top (cap_drop ALL, no-new-privileges), on a closed
# network. Neither service publishes a port: hb's door is the way in to the agent, on 127.0.0.1, and
# the storefront is reachable from the agent alone.
services:
  agent:
    image: ghcr.io/humanbound/arena-pricewatch-agent:1.1.0
    environment:
      STOREFRONT_BASE: http://storefront:8001
    depends_on: [storefront]
  storefront:
    image: ghcr.io/humanbound/arena-pricewatch-storefront:1.1.0
    expose: ["8001"]
