name: Publish

# On main: build and push the images of changed agents (linux/amd64 + linux/arm64), then
# regenerate index.json and the README catalog, and propose them as a pull request. Image tags are immutable: an existing tag fails
# the build, so every change to an agent needs a version bump.
on:
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "scripts/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: write # to push the branch of the catalog update
  packages: write # to publish images
  pull-requests: write # to open the catalog update
  actions: write # to start its checks

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Changed agents
        id: changed
        run: echo "agents=$(python scripts/changed_agents.py --base '${{ github.event.before }}')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        if: steps.changed.outputs.agents != '[]'
      - uses: docker/setup-buildx-action@v3
        if: steps.changed.outputs.agents != '[]'
      - uses: docker/login-action@v3
        if: steps.changed.outputs.agents != '[]'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push images
        if: steps.changed.outputs.agents != '[]'
        run: |
          # --skip-existing: a tooling-only change republishes nothing. An agent changed without a
          # version bump can't reach main (policy_check.py fails the PR).
          for id in $(echo '${{ steps.changed.outputs.agents }}' | python -c 'import json,sys; print(" ".join(json.load(sys.stdin)))'); do
            python scripts/build_images.py "$id" --push --skip-existing --platforms linux/amd64,linux/arm64 \
              --digests-out "$RUNNER_TEMP/digests.json" \
              || { echo "::error::$id was not published (see above)"; failed=1; }
          done
          exit ${failed:-0}
      # Only after every image is published: index.json must never point at a missing image.
      - name: Regenerate index.json and the README catalog
        run: |
          # No file when --skip-existing skipped every agent; build_index then carries forward
          # the digests already in the catalog.
          if [ -f "$RUNNER_TEMP/digests.json" ]; then
            python scripts/build_index.py --digests "$RUNNER_TEMP/digests.json"
          else
            python scripts/build_index.py
          fi
      # main takes changes through pull requests only, so the catalog is proposed, not pushed.
      - name: Propose the catalog update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/open_catalog_pr.sh "chore: regenerate index.json"
