name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # The catalog updates CI opens start no workflow by themselves, so CI starts this one on them.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    name: Signed-off-by check
    runs-on: ubuntu-latest
    steps:
      - name: Verify every commit carries a Signed-off-by trailer
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // A pull request lists its own commits. Started by hand or by CI, there is no
            // pull request to ask, so take what this branch adds to main.
            const pr = context.payload.pull_request;
            const commits = pr
              ? await github.paginate(github.rest.pulls.listCommits, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                })
              : (await github.rest.repos.compareCommitsWithBasehead({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  basehead: `main...${context.sha}`,
                })).data.commits;
            // Merge commits are bot-generated and exempt, matching the
            // behavior of the standard probot DCO app.
            const missing = commits
              .filter(c => c.parents.length < 2)
              .filter(c => !/^Signed-off-by: .+ <.+@.+>$/m.test(c.commit.message));
            if (missing.length === 0) {
              core.info(`All ${commits.length} commit(s) are signed off.`);
              return;
            }
            const list = missing
              .map(c => `  ${c.sha.slice(0, 7)} ${c.commit.message.split('\n')[0]}`)
              .join('\n');
            core.setFailed(
              `${missing.length} commit(s) are missing a Signed-off-by trailer (see DCO.md):\n` +
              `${list}\n\n` +
              `Fix with "git commit --amend -s" (single commit) or ` +
              `"git rebase --signoff origin/main" (whole branch), then force-push.`
            );
